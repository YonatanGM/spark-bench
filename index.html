<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Splat Stress Test</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/",
        "@sparkjsdev/spark": "./vendor/spark/spark.module.min.js"
      }
    }
  </script>
</head>
<body>
  <header>
    <select id="scene" aria-label="Scene"></select>
    <button id="reset" type="button">Reset view</button>
    <select id="budget" aria-label="LOD budget" title="SparkRenderer.lodSplatCount. All splats turns LOD off.">
      <option value="auto">Auto LOD</option>
      <option value="5000000">Base budget: 5M</option>
      <option value="2500000">Base budget: 2.5M</option>
      <option value="1000000">Base budget: 1M</option>
      <option value="500000">Base budget: 500k</option>
      <option value="250000">Base budget: 250k</option>
      <option value="custom">Custom base budget…</option>
      <option value="full">All splats (LOD off)</option>
    </select>
    <input id="custom" type="number" min="10000" max="50000000" step="10000" inputmode="numeric" aria-label="Custom base budget" hidden>
    <label title="SparkRenderer.lodSplatScale: multiplies the base budget">LOD scale <input id="scale" type="range" min="0.1" max="2" step="0.1" value="1"><output id="scale-out">1.0×</output></label>
    <label title="Render resolution relative to the screen. Lower = fewer pixels to fill.">Resolution
      <select id="dpr" aria-label="Render resolution"></select>
    </label>
  </header>

  <main id="view">
    <canvas id="canvas" tabindex="0" aria-label="Splat scene"></canvas>
    <div id="loading" role="status">Loading…</div>
    <section id="readout" aria-label="Live stats"></section>
    <div id="credit"></div>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
