<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Splat Stress Test</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/",
        "@sparkjsdev/spark": "./vendor/spark/spark.module.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Splat scene"></canvas>

  <section id="hud" aria-label="Controls and stats">
    <button id="hud-toggle" type="button">
      <span id="hud-summary">Loading</span>
      <span id="hud-toggle-text">Hide</span>
    </button>
    <div id="hud-body">
      <div class="controls">
        <label>Scene <select id="scene"></select></label>
        <label>Budget
          <select id="budget">
            <option value="auto">Auto</option>
            <option value="10000000">10M</option>
            <option value="5000000">5M</option>
            <option value="2500000">2.5M</option>
            <option value="1500000">1.5M</option>
            <option value="1000000">1M</option>
            <option value="500000">500k</option>
            <option value="250000">250k</option>
            <option value="custom">Custom</option>
            <option value="full">All splats (LOD off)</option>
          </select>
        </label>
        <label id="custom-wrap" hidden>Custom budget <input id="custom" type="number" min="10000" max="50000000" step="10000" inputmode="numeric"></label>
        <label>LOD scale <span class="row"><input id="scale" type="range" min="0.1" max="3" step="0.1"><output id="scale-out"></output></span></label>
        <div class="buttons"><button id="reset" type="button">Reset view</button><button id="copy" type="button">Copy stats</button></div>
      </div>
      <div id="stats"></div>
      <div id="credit"></div>
    </div>
  </section>

  <div id="hint" aria-hidden="true" hidden></div>

  <div id="loading" role="status">
    <div class="load-card">
      <div id="load-title">Starting</div>
      <div class="bar"><div id="load-bar"></div></div>
      <div id="load-detail"></div>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
